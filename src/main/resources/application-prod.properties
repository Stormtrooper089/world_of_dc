server.port=8080
server.servlet.context-path=/

# JWT — must be set via environment variable JWT_SECRET in production
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}

# Voice assistant LLM (Groq) — set via VOICEASSISTANT_LLM_API_KEY in production.
# Left unset, ChatToolCallingClient runs in placeholder mode (assistant reports
# itself unavailable instead of holding a real conversation) rather than failing
# to start — this integration is optional, unlike JWT above.
voiceassistant.llm.api-key=${VOICEASSISTANT_LLM_API_KEY:}

# Bhashini cloud speech-to-text/text-to-speech (Hindi/Assamese/Bengali) — set via
# BHASHINI_USER_ID and BHASHINI_API_KEY in production. Left unset, the widget's
# cloud voice input/output falls back to typed text / browser speech synthesis.
bhashini.user-id=${BHASHINI_USER_ID:}
bhashini.api-key=${BHASHINI_API_KEY:}

# MongoDB URI - MUST be set via environment variable MONGODB_URI or SPRING_DATA_MONGODB_URI
# Spring Boot automatically maps SPRING_DATA_MONGODB_URI to spring.data.mongodb.uri
# If not set, will use default (which should fail in production - this is intentional)
# For production deployment, ensure MONGODB_URI is set in .env file
spring.data.mongodb.uri=mongodb+srv://ashishunhale1420_db_user:PdkaSguegT36b8A0@cluster0.f0u1sly.mongodb.net/cachar_complaints?retryWrites=true&w=majority&tls=true
spring.data.mongodb.auto-index-creation=true

# Logging configuration
logging.level.root=WARN
logging.level.com.cachar.complaint=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO
logging.file.name=/var/log/cachar-complaints/application.log

# Log MongoDB connection details (masked password)
logging.level.org.springframework.boot.autoconfigure.mongo=DEBUG
